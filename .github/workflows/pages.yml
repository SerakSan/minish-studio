name: Publish Minish Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the software
        uses: actions/checkout@v4
      - name: Check editor behavior
        run: |
          node tests/editor-smoke.mjs
          node tests/controls.mjs
          node tests/random-scenes-variation.mjs
          node tests/animation-engine.mjs
          node tests/animation-ui-controls.mjs
          node tests/animation-export.mjs
          node tests/simple-animation.mjs
          node tests/ezlo-switch.mjs
      - name: Build and check the public site
        run: python3 tools/build_public_release.py --output _site --site-only
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
